[package]
name = "quat_mp4"
version = "1.1.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "A Rust library for packing binary bits into 2-bit quaternary digits (quats) for MP4 processing."
readme = "README.md"
repository = "https://github.com/strahinjastojanovic826-code/quat_mp4"
license = "AGPL-3.0-or-later"
keywords = ["mp4", "quaternary", "bit-packing", "codec", "quits"]
categories = ["encoding", "data-structures"]

[lib]
name = "quat_mp4"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
